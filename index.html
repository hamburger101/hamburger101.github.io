<style>
/* The root of hamburger101.github.io: a doorway to the Reagent Launcher site,
   in the launcher's own palette (dark first). */
:root {
  --bg: #0b0c0f; --card: #121317; --chip: #1a1b20; --line: #2d3038;
  --text: #f3f4f6; --dim: #a2a6b0; --cta: #f5f5f7; --cta-hover: #ffffff; --cta-ink: #0b0c0f;
  --glow: rgba(139, 123, 255, 0.28); --accent: #8b7bff;
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --card: #ffffff; --chip: #eceef2; --line: #cfd3db;
    --text: #121318; --dim: #5a5f6a; --cta: #121318; --cta-hover: #2a2c33; --cta-ink: #ffffff;
    --glow: rgba(107, 92, 240, 0.2); --accent: #6b5cf0;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.6 var(--font);
  -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding-inline: 20px;
  background-image: radial-gradient(40rem 26rem at 50% 30%, var(--glow), transparent 70%);
}
main { display: grid; justify-items: center; gap: 18px; text-align: center; max-width: 34rem; padding-block: 48px; }
img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 24px 60px -20px var(--glow); }
h1 { margin: 6px 0 0; font-size: clamp(2.2rem, 1.6rem + 3vw, 3.2rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
p { margin: 0; color: var(--dim); font-size: 1.125rem; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
a.btn {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 12px;
  font-weight: 600; text-decoration: none; border: 1px solid transparent;
}
.primary { background: var(--cta); color: var(--cta-ink); }
.primary:hover { background: var(--cta-hover); }
.quiet { background: var(--chip); color: var(--text); border-color: var(--line); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
